name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        emacs: ["31.1", "snapshot"]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          path: dotemacs
          submodules: recursive

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Install config to ~/.emacs.d
        run: cp -aT "$GITHUB_WORKSPACE/dotemacs" "$HOME/.emacs.d"

      - name: Report environment
        run: |
          . /etc/os-release && echo "$PRETTY_NAME"
          emacs --version | head -1
          git --version

      - name: Lint elisp
        run: emacs --batch -l "$HOME/.emacs.d/.github/ci/lint-elisp.el"

      - name: Bootstrap packages
        run: emacs --batch -l "$HOME/.emacs.d/init.el"

      - name: Validate startup
        run: emacs --batch -l "$HOME/.emacs.d/.github/ci/validate-startup.el"

      - name: Validate packages load
        run: emacs --batch -l "$HOME/.emacs.d/.github/ci/validate-packages.el"

      - name: Report resolved versions
        if: always()
        run: |
          echo "== elpa =="
          ls -1 "$HOME/.emacs.d/elpa" 2>/dev/null || echo "(none)"
