name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        emacs: ["31.1", "snapshot"]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          path: dotemacs
          submodules: recursive

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Install config to ~/.emacs.d
        run: cp -aT "$GITHUB_WORKSPACE/dotemacs" "$HOME/.emacs.d"

      - name: Report environment
        run: |
          . /etc/os-release && echo "$PRETTY_NAME"
          emacs --version | head -1
          git --version

      - name: Lint elisp
        run: emacs --batch -l "$HOME/.emacs.d/.github/ci/lint-elisp.el"

      - name: Bootstrap packages
        run: emacs --batch -l "$HOME/.emacs.d/init.el"

      - name: Validate startup
        run: emacs --batch -l "$HOME/.emacs.d/.github/ci/validate-startup.el"

      - name: Validate packages load
        run: emacs --batch -l "$HOME/.emacs.d/.github/ci/validate-packages.el"

      - name: Report resolved versions
        if: always()
        run: |
          echo "== elpa =="
          ls -1 "$HOME/.emacs.d/elpa" 2>/dev/null || echo "(none)"

  neomacs:
    name: Neomacs 0.0.18
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEOMACS_VERSION: "0.0.18"
      NEOMACS_DEB: neomacs_0.0.18_amd64.deb

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          path: dotemacs
          submodules: recursive

      - name: Download and verify Neomacs
        run: |
          release_url="https://github.com/eval-exec/neomacs/releases/download/v${NEOMACS_VERSION}"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$NEOMACS_DEB" \
            "$release_url/$NEOMACS_DEB"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/SHA256SUMS" \
            "$release_url/SHA256SUMS"
          cd "$RUNNER_TEMP"
          sha256sum --ignore-missing --check SHA256SUMS

      - name: Install Neomacs
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            "$RUNNER_TEMP/$NEOMACS_DEB"

      - name: Install config to ~/.emacs.d
        run: cp -aT "$GITHUB_WORKSPACE/dotemacs" "$HOME/.emacs.d"

      - name: Report environment
        run: |
          . /etc/os-release && echo "$PRETTY_NAME"
          neomacs --version | head -1
          git --version

      - name: Lint elisp
        run: neomacs --batch -l "$HOME/.emacs.d/.github/ci/lint-elisp.el"

      - name: Bootstrap packages
        run: neomacs --batch -l "$HOME/.emacs.d/init.el"

      - name: Validate startup
        run: neomacs --batch -l "$HOME/.emacs.d/.github/ci/validate-startup.el"

      - name: Validate packages load
        run: neomacs --batch -l "$HOME/.emacs.d/.github/ci/validate-packages.el"

      - name: Report resolved versions
        if: always()
        run: |
          echo "== elpa =="
          ls -1 "$HOME/.emacs.d/elpa" 2>/dev/null || echo "(none)"
